name: Subtle Medical
description: 'Subtle Medical is a healthcare AI company founded in 2017 and headquartered
  in Menlo Park, California, that develops FDA-cleared deep-learning software to enhance
  medical imaging. Its products — SubtleMR, SubtlePET, SubtleGAD and SubtleSYNTH — denoise,
  accelerate and improve MRI and PET scans, integrating into existing radiology and PACS
  workflows via DICOM rather than through a public developer API or REST platform. The
  company is backed by Bessemer Venture Partners and DCVC. No public developer API,
  OpenAPI specification, SDK, or developer portal was discoverable during enrichment;
  DNS/TLS domain-security posture was probed.'
